services:
  - type: web
    name: maplematch-api
    runtime: python
    rootDir: MapleMatch/apps/api
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: JWKS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEBUG
        value: false
      - key: CMHC_API_URL
        value: https://api-prd.cmhc-schl.gc.ca/cmba/api
